asyncapi: 3.0.0

info:
  title: auth-service — Eventos (identidad y acceso)
  version: 2.0.0
  description: >
    Contrato de mensajería de **auth-service** sobre RabbitMQ. auth es el dueño del
    dominio de identidad; **publica** eventos `identity.*` (y algunos `auth.*`) cuando
    cambia el estado de usuarios/roles, y **consume** `organization.org.created` para
    sembrar roles y crear al fundador. Los eventos se emiten con el patrón **Outbox**
    (se escriben en `outbox_messages` en la misma transacción y un relay los publica).


    Convención: exchange **topic** `crm.events`; la **routing key** es el `type` del
    evento (p. ej. `identity.user.role_assigned`). Nombres en **pasado**. Los eventos
    `identity.*` nombran el **contexto de dominio** (identidad), no el nombre del despliegue.

defaultContentType: application/json

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: Broker RabbitMQ (desarrollo). En producción, la URL va en RABBITMQ_URL.
    bindings:
      amqp:
        vhost: /

channels:

  userCreated:
    address: identity.user.created
    description: Se creó un usuario (registro, Google o invitación).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userCreated:
        $ref: '#/components/messages/UserCreated'

  userRoleAssigned:
    address: identity.user.role_assigned
    description: Se asignó (o cambió) un rol a un usuario en una organización.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userRoleAssigned:
        $ref: '#/components/messages/UserRoleAssigned'

  userRoleRemoved:
    address: identity.user.role_removed
    description: Se quitó un rol a un usuario en una organización.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userRoleRemoved:
        $ref: '#/components/messages/UserRoleRemoved'

  roleUpdated:
    address: identity.role.updated
    description: Cambiaron los permisos de un rol (implica pv++ a sus usuarios).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      roleUpdated:
        $ref: '#/components/messages/RoleUpdated'

  roleDeleted:
    address: identity.role.deleted
    description: Se eliminó un rol personalizado de una organización (no tenía usuarios asignados).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      roleDeleted:
        $ref: '#/components/messages/RoleDeleted'

  trustedIpCreated:
    address: identity.trusted_ip.created
    description: Se añadió una IP de confianza (el gateway le aplica el límite de peticiones holgado). Evento de plataforma (sin organizationId), para la bitácora de auditoría.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      trustedIpCreated:
        $ref: '#/components/messages/TrustedIpCreated'

  trustedIpUpdated:
    address: identity.trusted_ip.updated
    description: Se modificó una IP de confianza (cambio de IP, etiqueta o si está habilitada). Evento de plataforma (sin organizationId), para la bitácora de auditoría.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      trustedIpUpdated:
        $ref: '#/components/messages/TrustedIpUpdated'

  trustedIpDeleted:
    address: identity.trusted_ip.deleted
    description: Se eliminó una IP de confianza. Evento de plataforma (sin organizationId), para la bitácora de auditoría.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      trustedIpDeleted:
        $ref: '#/components/messages/TrustedIpDeleted'

  sessionLoginSucceeded:
    address: auth.session.login_succeeded
    description: Inicio de sesión correcto (contraseña o Google). Solo para la bitácora de auditoría. El prefijo es auth. (no identity.) a propósito, para que el gateway no lo trate como cambio de permisos.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      sessionLoginSucceeded:
        $ref: '#/components/messages/SessionLoginSucceeded'

  sessionLoginFailed:
    address: auth.session.login_failed
    description: Intento de inicio de sesión fallido (contraseña incorrecta, correo inexistente o cuenta deshabilitada). Solo para la bitácora de auditoría. El prefijo es auth. (no identity.) a propósito, para que el gateway no lo trate como cambio de permisos.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      sessionLoginFailed:
        $ref: '#/components/messages/SessionLoginFailed'

  sessionLogout:
    address: auth.session.logout
    description: Se cerró una sesión (solo si el refresh token seguía activo). Solo para la bitácora de auditoría. El prefijo es auth. (no identity.) a propósito, para que el gateway no lo trate como cambio de permisos.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      sessionLogout:
        $ref: '#/components/messages/SessionLogout'

  sessionOrgSwitched:
    address: auth.session.org_switched
    description: La persona cambió de organización activa. Solo para la bitácora de auditoría. El prefijo es auth. (no identity.) a propósito, para que el gateway no lo trate como cambio de permisos.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      sessionOrgSwitched:
        $ref: '#/components/messages/SessionOrgSwitched'

  userDisabled:
    address: identity.user.disabled
    description: Se deshabilitó un usuario (revocación de acceso).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userDisabled:
        $ref: '#/components/messages/UserDisabled'

  userLoggedIn:
    address: auth.user.logged_in
    description: Inicio de sesión exitoso (para auditoría).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userLoggedIn:
        $ref: '#/components/messages/UserLoggedIn'

  userProfileCompleted:
    address: identity.user.profile_completed
    description: El usuario completó su perfil (nombre + identificación).
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      userProfileCompleted:
        $ref: '#/components/messages/UserProfileCompleted'

  orgUpdated:
    address: organization.org.updated
    description: >
      (Consumido) Se actualizó una organización en organization-service. Auth
      actualiza el `country_code` de su read-model.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange: { name: crm.events, type: topic, durable: true, vhost: / }
    messages:
      orgCreated:
        $ref: '#/components/messages/OrgCreated'

operations:

  publishUserCreated:
    action: send
    channel: { $ref: '#/channels/userCreated' }
    summary: Emite identity.user.created.

  publishUserRoleAssigned:
    action: send
    channel: { $ref: '#/channels/userRoleAssigned' }
    summary: Emite identity.user.role_assigned (consumido por el gateway para refrescar la caché de pv).

  publishUserRoleRemoved:
    action: send
    channel: { $ref: '#/channels/userRoleRemoved' }
    summary: Emite identity.user.role_removed (mismo contrato que role_assigned; el gateway lo usa para pv y para avisar a las cajas).

  publishRoleUpdated:
    action: send
    channel: { $ref: '#/channels/roleUpdated' }
    summary: Emite identity.role.updated (consumido por el gateway para la caché de pv).

  publishRoleDeleted:
    action: send
    channel: { $ref: '#/channels/roleDeleted' }
    summary: Emite identity.role.deleted (bitácora de auditoría).

  publishTrustedIpCreated:
    action: send
    channel: { $ref: '#/channels/trustedIpCreated' }
    summary: Emite identity.trusted_ip.created (bitácora de auditoría).

  publishTrustedIpUpdated:
    action: send
    channel: { $ref: '#/channels/trustedIpUpdated' }
    summary: Emite identity.trusted_ip.updated (bitácora de auditoría).

  publishTrustedIpDeleted:
    action: send
    channel: { $ref: '#/channels/trustedIpDeleted' }
    summary: Emite identity.trusted_ip.deleted (bitácora de auditoría).

  publishSessionLoginSucceeded:
    action: send
    channel: { $ref: '#/channels/sessionLoginSucceeded' }
    summary: Emite auth.session.login_succeeded (bitácora de auditoría).

  publishSessionLoginFailed:
    action: send
    channel: { $ref: '#/channels/sessionLoginFailed' }
    summary: Emite auth.session.login_failed (bitácora de auditoría).

  publishSessionLogout:
    action: send
    channel: { $ref: '#/channels/sessionLogout' }
    summary: Emite auth.session.logout (bitácora de auditoría).

  publishSessionOrgSwitched:
    action: send
    channel: { $ref: '#/channels/sessionOrgSwitched' }
    summary: Emite auth.session.org_switched (bitácora de auditoría).

  publishUserDisabled:
    action: send
    channel: { $ref: '#/channels/userDisabled' }
    summary: Emite identity.user.disabled.

  publishUserLoggedIn:
    action: send
    channel: { $ref: '#/channels/userLoggedIn' }
    summary: Emite auth.user.logged_in.

  publishUserProfileCompleted:
    action: send
    channel: { $ref: '#/channels/userProfileCompleted' }
    summary: Emite identity.user.profile_completed.

  consumeOrgUpdated:
    action: receive
    channel: { $ref: '#/channels/orgUpdated' }
    summary: Consume organization.org.updated y actualiza country_code.

components:

  messageTraits:
    eventEnvelope:
      headers:
        type: object
        properties:
          eventId: { type: string, format: uuid, description: Identificador único del evento (idempotencia). }
          type: { type: string, description: Tipo del evento = routing key. }
          occurredAt: { type: string, format: date-time }
          organizationId:
            type: string
            format: uuid
            nullable: true
            description: Contexto de organización si aplica (para consumidores multi-org).

  messages:

    UserCreated:
      name: identity.user.created
      title: Usuario creado
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserCreatedPayload'

    UserRoleAssigned:
      name: identity.user.role_assigned
      title: Rol asignado a usuario
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserRoleAssignedPayload'

    UserRoleRemoved:
      name: identity.user.role_removed
      title: Rol quitado a usuario
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserRoleAssignedPayload'

    RoleDeleted:
      name: identity.role.deleted
      title: Rol eliminado
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/RoleDeletedPayload'

    TrustedIpCreated:
      name: identity.trusted_ip.created
      title: IP de confianza creada
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/TrustedIpPayload'

    SessionLoginSucceeded:
      name: auth.session.login_succeeded
      title: Inicio de sesión
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/SessionPayload'

    SessionLoginFailed:
      name: auth.session.login_failed
      title: Intento de inicio de sesión fallido
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/SessionPayload'

    SessionLogout:
      name: auth.session.logout
      title: Cierre de sesión
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/SessionPayload'

    SessionOrgSwitched:
      name: auth.session.org_switched
      title: Cambio de organización
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/SessionPayload'

    TrustedIpUpdated:
      name: identity.trusted_ip.updated
      title: IP de confianza modificada
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/TrustedIpPayload'

    TrustedIpDeleted:
      name: identity.trusted_ip.deleted
      title: IP de confianza eliminada
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/TrustedIpPayload'

    RoleUpdated:
      name: identity.role.updated
      title: Permisos de rol actualizados
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/RoleUpdatedPayload'

    UserDisabled:
      name: identity.user.disabled
      title: Usuario deshabilitado
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserDisabledPayload'

    UserLoggedIn:
      name: auth.user.logged_in
      title: Inicio de sesión
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserLoggedInPayload'

    UserProfileCompleted:
      name: identity.user.profile_completed
      title: Perfil completado
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/UserProfileCompletedPayload'

    OrgUpdated:
      name: organization.org.updated
      title: Organización actualizada
      contentType: application/json
      traits:
        - $ref: '#/components/messageTraits/eventEnvelope'
      payload:
        $ref: '#/components/schemas/OrgUpdatedPayload'

  schemas:

    UserCreatedPayload:
      type: object
      required: [userId, email]
      properties:
        userId: { type: string, format: uuid }
        email: { type: string, format: email }

    UserRoleAssignedPayload:
      type: object
      required: [userId, organizationId, roleId, pv]
      properties:
        userId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        pv:
          type: integer
          description: Nuevo permissions_version del usuario tras la asignación.
          example: 4

    RoleUpdatedPayload:
      type: object
      required: [roleId, organizationId]
      properties:
        roleId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }

    RoleDeletedPayload:
      type: object
      required: [roleId, organizationId, name]
      properties:
        roleId: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        name: { type: string, description: Nombre que tenía el rol. }

    TrustedIpPayload:
      type: object
      required: [targetId, ip]
      properties:
        targetId: { type: string, format: uuid, description: Id de la IP de confianza afectada. }
        ip: { type: string, description: IP exacta o CIDR. }
        label: { type: string, nullable: true }
        enabled: { type: boolean, description: No viene en identity.trusted_ip.deleted. }
        previous:
          type: object
          description: Solo en identity.trusted_ip.updated. Valores antes del cambio.
          properties:
            ip: { type: string }
            label: { type: string, nullable: true }
            enabled: { type: boolean }

    SessionPayload:
      type: object
      properties:
        actorId: { type: string, format: uuid, description: Usuario. Ausente en login_failed si el correo no existe. }
        actorEmail: { type: string }
        actorIp: { type: string }
        organizationId: { type: string, format: uuid, description: Organización activa de la sesión (no viene si aún no tiene). }
        provider: { type: string, enum: [password, google] }
        reason: { type: string, enum: [invalid_credentials, account_disabled], description: Solo en login_failed. }
        userAgent: { type: string, description: Recortado a 200 caracteres. }

    UserDisabledPayload:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }

    UserLoggedInPayload:
      type: object
      required: [userId, at]
      properties:
        userId: { type: string, format: uuid }
        at: { type: string, format: date-time }
        ip: { type: string, nullable: true }

    UserProfileCompletedPayload:
      type: object
      required: [userId, fullName, identification]
      properties:
        userId: { type: string, format: uuid }
        fullName: { type: string }
        identification: { type: string, description: 'solo el número (el tipo va aparte en identificationType)', example: '1712345678' }
        identificationType: { type: string, enum: [cedula, ruc, passport, dni] }
        organizationIds: { type: array, items: { type: string, format: uuid }, description: 'Organizaciones activas del usuario (para avisar a sus cajas POS)' }

    OrgUpdatedPayload:
      type: object
      required: [organizationId]
      description: Payload esperado del evento de organization-service.
      properties:
        organizationId: { type: string, format: uuid }
        name: { type: string, nullable: true, example: Mi Empresa S.A. }
        countryCode: { type: string, nullable: true, example: EC }
