apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service-node
  labels:
    app: auth-service-node
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service-node
  template:
    metadata:
      labels:
        app: auth-service-node
    spec:
      initContainers:
        - name: auth-migrate
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          securityContext:
            runAsUser: 0
          command:
            - sh
            - -c
            - "npx sequelize-cli db:migrate"
          env:
            - name: NODE_ENV
              value: "production"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: name
      containers:
        - name: auth-service
          image: ${REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: port
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-db
                  key: name
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt
                  key: private-key
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-jwt
                  key: public-key
            - name: JWT_ACCESS_TTL
              value: "900"
            - name: JWT_REFRESH_TTL
              value: "2592000"
            - name: JWT_ISSUER
              value: "auth-service"
            - name: JWT_AUDIENCE
              value: "crm-api"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-google
                  key: client-id
            - name: CORS_ORIGIN
              value: "https://steep-geology-napping.ngrok-free.dev"
            # Nombre público del frontend: los enlaces que genera el backend
            # (invitación, restablecer contraseña) usan esta base. Sin ella cae
            # al default localhost:5173 y los enlaces llegan rotos a producción.
            - name: FRONTEND_URL
              value: "https://crm.noahsolution.com"
            - name: OTEL_SERVICE_NAME
              value: "auth-service"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: INTERNAL_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: internal-service-secret
                  key: value
            - name: RABBITMQ_URL
              value: "amqp://rabbitmq:5672"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            # Sin `limits` a proposito: un tope de CPU de 300m estrangulaba al servicio (throttle)
            # y las pruebas de stress-petitions medían el limite de Kubernetes, no la capacidad
            # del codigo, con el nodo casi ocioso. Se conservan los `requests` (reserva).
          # El default de timeoutSeconds es 1s: bajo saturacion (login con Argon2 puede
          # llevar la CPU a varios nucleos) /health tardaba mas y tres fallos seguidos
          # (~45s) hacian que Kubernetes matara el pod ("Liveness probe failed: context
          # deadline exceeded" + Killing, 3 reinicios en una prueba de carga), lo que
          # agravaba la caida. Liveness solo debe matar un proceso realmente colgado:
          # 5s de timeout y 6 fallos (~90s) antes de reiniciar.
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
